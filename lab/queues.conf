; /etc/asterisk/queues.conf — Call Center on Asterisk (VoIP I semestral project)
; NOTE: for dynamic agent login with *88/*89, comment out the static "member =>" lines.

[general]
persistentmembers=yes

[sales]
strategy=ringall
timeout=15
retry=5
maxlen=10
joinannounce=cc-you-are-next
announce-frequency=30
periodic-announce-frequency=60
periodic-announce=cc-please-hold
musicclass=default
member => PJSIP/2001,0,Agent-2001
member => PJSIP/2002,0,Agent-2002

[support]
strategy=leastrecent
timeout=20
retry=5
maxlen=10
musicclass=default
member => PJSIP/2002,0,Agent-2002
