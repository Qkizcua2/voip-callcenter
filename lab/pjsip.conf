; /etc/asterisk/pjsip.conf — Call Center on Asterisk (VoIP I semestral project)
; Copy to /etc/asterisk/pjsip.conf in the Ubuntu VM.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------------------------------------------------------
; Caller: extension 1000
; ---------------------------------------------------------------
[auth-1000]
type=auth
auth_type=userpass
username=1000
password=Secret1000!

[aor-1000]
type=aor
max_contacts=1

[1000]
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=ulaw
dtmfmode=rfc2833
auth=auth-1000
aors=aor-1000
callerid="Caller" <1000>

; ---------------------------------------------------------------
; Agent: extension 2001
; ---------------------------------------------------------------
[auth-2001]
type=auth
auth_type=userpass
username=2001
password=Secret2001!

[aor-2001]
type=aor
max_contacts=1

[2001]
type=endpoint
transport=transport-udp
context=agent-control
disallow=all
allow=ulaw
dtmfmode=rfc2833
auth=auth-2001
aors=aor-2001
callerid="Agent 2001" <2001>

; ---------------------------------------------------------------
; Agent: extension 2002
; ---------------------------------------------------------------
[auth-2002]
type=auth
auth_type=userpass
username=2002
password=Secret2002!

[aor-2002]
type=aor
max_contacts=1

[2002]
type=endpoint
transport=transport-udp
context=agent-control
disallow=all
allow=ulaw
dtmfmode=rfc2833
auth=auth-2002
aors=aor-2002
callerid="Agent 2002" <2002>
