; /etc/asterisk/extensions.conf — Call Center on Asterisk (VoIP I semestral project)
; Contexts: from-internal -> ivr-main -> call-queue ; agent-control for *88/*89.

[general]
static=yes
writeprotect=no

[from-internal]
; simple test extension
exten => 600,1,NoOp(Test call from ${CALLERID(num)})
 same => n,Playback(hello-world)
 same => n,Hangup()

; dial another agent extension directly (2001, 2002, ...)
exten => _2XXX,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; everything else goes to the IVR (more specific patterns win)
exten => _.,1,Goto(ivr-main,s,1)

[ivr-main]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Progress()
 same => n,Set(SELECTED_QUEUE=sales)
 same => n,Background(cc-welcome)
 same => n,WaitExten(5)

exten => 1,1,Set(SELECTED_QUEUE=sales)
 same => n,Goto(call-queue,s,1)

exten => 2,1,Set(SELECTED_QUEUE=support)
 same => n,Goto(call-queue,s,1)

exten => 0,1,Goto(call-queue,s,1)
exten => t,1,Goto(call-queue,s,1)
exten => i,1,Playback(invalid)
 same => n,Goto(s,1)

[call-queue]
exten => s,1,Progress()
; For the demo you may temporarily shorten 120 -> 20 seconds
 same => n,Queue(${SELECTED_QUEUE},,,,120)
 same => n,Playback(cc-no-agent-available)
 same => n,VoiceMail(1000@voip)
 same => n,Hangup()

[agent-control]
; Dial *88 to join the sales queue, *89 to leave it.
exten => *88,1,Set(MEMBER=PJSIP/${CHANNEL(peername)})
 same => n,AddQueueMember(sales,${MEMBER})
 same => n,Playback(agent-loginok)
 same => n,Hangup()

exten => *89,1,RemoveQueueMember(sales,PJSIP/${CHANNEL(peername)})
 same => n,Playback(agent-loggedoff)
 same => n,Hangup()
